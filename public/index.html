<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: #eee; }
    .app { max-width: 720px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 0.25rem; }
    .chat { margin-top: 20px; display: grid; gap: 12px; }
    .message { border-radius: 12px; padding: 14px 18px; line-height: 1.5; }
    .message.user { background: rgba(0, 128, 255, 0.18); color: #cceeff; text-align: right; }
    .message.bot { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .controls { display: grid; gap: 10px; margin-top: 18px; }
    textarea { width: 100%; min-height: 100px; resize: vertical; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #121212; color: #eee; }
    button { padding: 12px 18px; font-size: 1rem; border: none; border-radius: 10px; background: #0288d1; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .note { margin-top: 8px; font-size: 0.92rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Antigravity Chatbot</h1>
    <p>Ask the bot anything and get responses from Google Gemini.</p>
    <div class="chat" id="chat"></div>
    <div class="controls">
      <textarea id="prompt" placeholder="Type your message here..."></textarea>
      <button id="send">Send</button>
      <div class="note">Running on <strong>localhost:5000</strong>. Type your message and click Send.</div>
    </div>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');

    function addMessage(text, role) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = text;
      chat.appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
    }

    async function sendPrompt() {
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      addMessage(prompt, 'user');
      promptEl.value = '';
      sendBtn.disabled = true;
      addMessage('Thinking...', 'bot');

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });

        const result = await response.json();
        const botMessage = result.reply || result.error || 'No response.';
        const last = chat.lastElementChild;
        if (last && last.textContent === 'Thinking...') {
          last.textContent = botMessage;
        } else {
          addMessage(botMessage, 'bot');
        }
      } catch (error) {
        const last = chat.lastElementChild;
        if (last && last.textContent === 'Thinking...') {
          last.textContent = `Error: ${error.message}`;
        } else {
          addMessage(`Error: ${error.message}`, 'bot');
        }
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendPrompt);
    promptEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendPrompt();
      }
    });
  </script>
</body>
</html>
